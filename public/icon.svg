<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102A43"/>
      <stop offset="100%" stop-color="#08111e"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F28C28"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="#20446b" stroke-width="4"/>
  
  <!-- Stylized Bus Body -->
  <g transform="translate(96, 120)">
    <!-- Main Coach Frame -->
    <rect x="20" y="30" width="280" height="180" rx="36" fill="#ffffff" />
    <!-- Blue Bottom Trim -->
    <path d="M 20 150 L 300 150 L 300 174 A 36 36 0 0 1 264 210 L 56 210 A 36 36 0 0 1 20 174 Z" fill="#3B82F6" />
    
    <!-- Windshield -->
    <rect x="40" y="50" width="240" height="70" rx="14" fill="#0f172a" />
    <!-- Destination Display -->
    <rect x="80" y="56" width="160" height="18" rx="4" fill="#F28C28" />
    <text x="160" y="70" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">BUSWAY EXPRESS</text>
    
    <!-- Headlights -->
    <circle cx="50" cy="170" r="14" fill="#facc15" stroke="#ca8a04" stroke-width="3" />
    <circle cx="270" cy="170" r="14" fill="#facc15" stroke="#ca8a04" stroke-width="3" />
    
    <!-- Wheels -->
    <circle cx="80" cy="216" r="28" fill="#1e293b" />
    <circle cx="80" cy="216" r="14" fill="#cbd5e1" />
    <circle cx="240" cy="216" r="28" fill="#1e293b" />
    <circle cx="240" cy="216" r="14" fill="#cbd5e1" />
  </g>
  
  <!-- Speed lines in Orange -->
  <path d="M 60 380 L 450 380" stroke="url(#orangeGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 120 410 L 390 410" stroke="url(#orangeGrad)" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <text x="256" y="470" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    BUS<tspan fill="#F28C28">WAY</tspan>
  </text>
</svg>
